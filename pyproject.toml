[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tailscale-codex-bootstrap"
version = "0.1.0"
description = "Resumable interactive Linux bootstrap for a Tailscale App Connector pilot"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
tailnet-codex = "tailnet_bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tailnet_bootstrap = ["installer-lock.json"]
